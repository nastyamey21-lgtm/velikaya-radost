<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Великая радость</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: иконописная палитра — ультрамарин плаща Архангела, киноварь, золото; верхняя панель-вкладки, ниже одна рабочая сцена на весь экран телевизора */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface-2:#e7ecf6; --line:#cfd8ea;
  --fg:#16213d; --muted:#56617d;
  --blue:#1f3c88; --blue-ink:#ffffff; --gold:#b9852a; --gold-soft:#f3e4c2;
  --red:#b8352b; --red-soft:#f8dcd8; --green:#2f7d4f; --green-soft:#d6efdf;
  --t1:#b8352b; --t2:#1f6fb8; --t3:#2f7d4f; --t4:#8a5a12;
  --display:"Oranienbaum","Times New Roman",Georgia,serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1430; --surface:#121e42; --surface-2:#1a2a57; --line:#2a3d73;
  --fg:#eef2fb; --muted:#a7b2d0;
  --blue:#5b84e6; --blue-ink:#0b1430; --gold:#e3b45a; --gold-soft:#3a2f17;
  --red:#ef7a6e; --red-soft:#43201f; --green:#6cc493; --green-soft:#183a29;
  --t1:#ef7a6e; --t2:#6aaef0; --t3:#6cc493; --t4:#e3b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1430; --surface:#121e42; --surface-2:#1a2a57; --line:#2a3d73;
  --fg:#eef2fb; --muted:#a7b2d0;
  --blue:#5b84e6; --blue-ink:#0b1430; --gold:#e3b45a; --gold-soft:#3a2f17;
  --red:#ef7a6e; --red-soft:#43201f; --green:#6cc493; --green-soft:#183a29;
  --t1:#ef7a6e; --t2:#6aaef0; --t3:#6cc493; --t4:#e3b45a; color-scheme:dark}
:root{--sky1:#cfe3fb;--sky2:#f4f8ff;--cloud:#ffffff;--skin:#f6d5b8;--robe:#fbf8ff;--art-op:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#0a1330;--sky2:#1a2c63;--cloud:#c9d6f2;--art-op:.75}}
:root[data-theme="dark"]{--sky1:#0a1330;--sky2:#1a2c63;--cloud:#c9d6f2;--art-op:.75}
html,body{min-height:100%}
body{background:var(--bg) linear-gradient(180deg,var(--sky1),var(--sky2)) fixed;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
header.top,main{position:relative;z-index:1}
.bg-art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--art-op)}
.bg-art svg{position:absolute;height:auto}
.a-star{left:3%;top:13%;width:clamp(70px,7vw,120px)}
.a-angel1{left:6%;top:24%;width:clamp(120px,11vw,210px)}
.a-michael{left:1%;top:50%;width:clamp(150px,13vw,250px)}
.a-church{left:4%;bottom:0;width:clamp(150px,13vw,250px)}
.a-angels{right:3%;top:13%;width:clamp(150px,14vw,260px)}
.a-mary{right:2%;top:41%;width:clamp(140px,12vw,230px)}
.a-jesus{right:5%;bottom:0;width:clamp(150px,13vw,250px)}
.a-dove{left:13%;top:7%;width:clamp(60px,5vw,90px)}
.a-spark{width:100%;height:100%;inset:0}
@media (max-width:1400px){.bg-art{opacity:calc(var(--art-op)*.35)}}
@media (max-width:720px){.a-michael,.a-mary,.a-angel1{display:none}}
main .wrap>.stack,main .wrap>.stage{max-width:1180px;margin-inline:auto}
main .stack>div:first-child{text-align:center}
.lead{margin-inline:auto}
main .stack>div:first-child .lead{text-align:center}
main .stack>.row{justify-content:center}
.count-pick,.rules,.board{margin-inline:auto;width:100%}
.rules ol{text-align:left}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.7rem;font-weight:400;line-height:1;color:var(--blue)}
.brand small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.02em}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:999px;font-weight:700}
nav.tabs button[aria-current="page"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
main .wrap{padding-block:24px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,4vw,3.2rem);color:var(--blue)}
h2{font-size:clamp(1.5rem,2.6vw,2.2rem)}
.lead{color:var(--muted);max-width:62ch;margin:.5rem auto 0;text-align:center}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:10px;font-weight:800}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1407}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.big{font-size:1.2rem;padding:14px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
.note{background:var(--gold-soft);border-radius:10px;padding:12px 14px}
.hidden-msg{color:var(--muted)}

/* Подготовка */
.count-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:560px}
.count-pick button{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 8px;font-family:var(--display);font-size:2.6rem;line-height:1}
.count-pick button span{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted);margin-top:6px}
.count-pick button[aria-pressed="true"]{border-color:var(--blue);background:var(--surface-2);color:var(--blue)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.name-field{display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--c);padding-left:12px}
.qty{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.qty label{display:flex;flex-direction:column;gap:6px}

/* Правила */
.rules{max-width:820px}
.rules ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:12px;font-size:1.15rem}
.pts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0}
.pt{border-radius:var(--r);padding:14px;text-align:center;border:1px solid var(--line);background:var(--surface)}
.pt b{display:block;font-family:var(--display);font-size:2.6rem;font-weight:400;line-height:1}
.lv-easy{--lv:var(--green)} .lv-medium{--lv:var(--gold)} .lv-hard{--lv:var(--red)}
.pt b{color:var(--lv)}

/* Игра */
.stage{display:flex;flex-direction:column;gap:16px}
.stage-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:800;background:var(--surface-2)}
.chip.lv{background:var(--lv);color:#fff}
:root[data-theme="dark"] .chip.lv{color:#0b1430}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.lv{color:#0b1430}}
.timer{margin-left:auto;display:flex;align-items:center;gap:12px}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(2.2rem,5vw,4.2rem);line-height:1;min-width:4ch;text-align:right}
.timer.low .clock{color:var(--red)}
.timer.done .clock{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lv);width:100%;transition:width .25s linear}
.question{font-family:var(--display);font-size:clamp(1.8rem,3.6vw,3.3rem);line-height:1.15;text-wrap:balance;margin:0;background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--lv);border-radius:var(--r);padding:20px 28px;box-shadow:0 6px 24px rgba(20,40,90,.12)}
.stage-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px}
main .stack>div:first-child{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 32px;width:fit-content;max-width:100%;margin-inline:auto}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ans{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;font-size:clamp(1.05rem,1.8vw,1.6rem);font-weight:700;min-width:0}
.ans .letter{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:900}
.ans.right{border-color:var(--green);background:var(--green-soft)}
.ans.right .letter{background:var(--green);color:#fff}
.teams{display:grid;gap:12px}
.team{border:2px solid var(--line);border-top:8px solid var(--c);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.team-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team-name{font-weight:900;font-size:clamp(1.1rem,1.8vw,1.6rem);overflow-wrap:anywhere;min-width:0}
.team-score{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(1.6rem,3vw,2.6rem);color:var(--c);line-height:1}
.press{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.press .btn{padding:8px 12px}
.order{font-weight:900;background:var(--c);color:#fff;border-radius:8px;padding:6px 10px;border:none}
:root[data-theme="dark"] .order{color:#0b1430}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .order{color:#0b1430}}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pick button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-weight:900;font-size:1.2rem}
.pick button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.pick button.ok{outline:3px solid var(--green);outline-offset:1px}
.delta{font-weight:900;font-size:1.1rem;font-variant-numeric:tabular-nums}
.delta.plus{color:var(--green)} .delta.minus{color:var(--red)} .delta.zero{color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.controls .spacer{flex:1}

/* Итоги */
.board{display:flex;flex-direction:column;gap:12px;max-width:820px}
.place{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:var(--r);padding:16px 20px}
.place .num{font-family:var(--display);font-size:3rem;line-height:1;width:1.4em;text-align:center}
.place.p1{background:var(--gold-soft);border-color:var(--gold)}
.place.p1 .num{color:var(--gold)}
.place .nm{font-weight:900;font-size:1.5rem;overflow-wrap:anywhere;min-width:0}
.place .sub{color:var(--muted);font-size:.95rem}
.place .sc{font-weight:900;font-size:2.4rem;font-variant-numeric:tabular-nums;color:var(--c)}

/* Результат команды после вопроса */
.verdict{font-weight:900;font-size:clamp(1.1rem,1.6vw,1.4rem);border-radius:10px;padding:8px 12px;text-align:center}
.verdict.ok{background:var(--green-soft);color:var(--green)}
.verdict.bad{background:var(--red-soft);color:var(--red)}
.verdict.none{background:var(--surface-2);color:var(--muted)}
.res-list{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:700;opacity:.55;min-width:0}
.res .letter{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:900}
.res .txt{min-width:0;overflow-wrap:break-word;hyphens:auto}
.res .mark{display:block;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.res.is-right{opacity:1;border-color:var(--green);background:var(--green-soft)}
.res.is-right .letter{background:var(--green);color:#fff}
.res.is-right .mark{color:var(--green)}
.res.is-pick{opacity:1;box-shadow:0 0 0 3px var(--c)}
.res.is-pick:not(.is-right){border-color:var(--red);background:var(--red-soft)}
.res.is-pick:not(.is-right) .letter{background:var(--red);color:#fff}
.res.is-pick:not(.is-right) .mark{color:var(--red)}
.right-tag{display:block;font-size:.8em;color:var(--green);font-weight:900;margin-top:4px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who span{background:var(--c);color:#fff;border-radius:999px;padding:2px 10px;font-size:.75em;font-weight:800}

/* Пьедестал */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,2vw,24px);padding-top:8px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(76px,19vw,250px);min-width:0}
.pcard{position:relative;background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:16px 12px;text-align:center;width:100%;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:0 8px 24px rgba(20,40,90,.12)}
.pcol.shown .pcard{border:3px solid var(--c)}
.pcol.p1.shown .pcard{background:var(--gold-soft);border-color:var(--gold)}
.pcard .nm{font-weight:900;font-size:clamp(1rem,2vw,1.7rem);overflow-wrap:anywhere;line-height:1.15}
.pcard .sc{font-weight:900;font-size:clamp(1.8rem,4vw,3.4rem);color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.pcard .sub{color:var(--muted);font-size:.85rem}
.pstar{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:2.6rem;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:twinkle 1.6s ease-in-out infinite}
.mystery{font-family:var(--display);font-size:4.5rem;color:var(--muted);line-height:1;animation:wobble 2.4s ease-in-out infinite}
.block{position:relative;width:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:14px 4px 22px;color:#fff;font-family:var(--display);font-size:clamp(2.4rem,5vw,4.6rem);line-height:.9;box-shadow:inset 0 -12px 0 rgba(0,0,0,.14),0 10px 24px rgba(20,40,90,.18);text-shadow:0 2px 0 rgba(0,0,0,.2);overflow:hidden}
.block::after{content:"";position:absolute;inset:0 auto 0 12%;width:18%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));transform:skewX(-12deg)}
.block small{font-family:var(--body);font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.pteams{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pteam{display:flex;flex-direction:column;border-left:6px solid var(--c);background:var(--bg);border-radius:8px;padding:6px 8px;text-align:left}
.pteam b{font-weight:900;font-size:clamp(.8rem,1.6vw,1.35rem);overflow-wrap:break-word;hyphens:auto;line-height:1.15}
.pteam span{color:var(--muted);font-size:.8rem}
.empty-step{font-family:var(--display);font-size:3rem;color:var(--line);line-height:1}
.pcol.is-empty .pcard{border-style:dotted;box-shadow:none;background:transparent}
.p4 .block{background:linear-gradient(180deg,#bccbe8,#6f86b3)}
.pcol.shown .pcard{border:3px solid var(--blue)}
.p1 .block{background:linear-gradient(180deg,#f0c95e,#b9852a)}
.p2 .block{background:linear-gradient(180deg,#d3dbea,#8794ad)}
.p3 .block{background:linear-gradient(180deg,#e4a774,#9a5a2a)}
.just .pcard,.place.just{animation:pop .8s cubic-bezier(.2,1.5,.4,1)}
.fourth{max-width:560px;margin-inline:auto;width:100%}
.fourth.hide4 .sc{color:var(--muted)}
@keyframes pop{0%{transform:scale(.3) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes twinkle{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}

.finale{position:relative;padding:40px 0 0;isolation:isolate}
.rays-wrap{position:absolute;left:0;right:0;top:-160px;bottom:0;overflow:hidden;z-index:-1;pointer-events:none}
.rays,.bunting,.trumpeter,.podium-clouds,.medal{pointer-events:none}
.rays{position:absolute;left:50%;top:52%;width:min(1200px,100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(240,190,70,.30) 0deg 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 60s linear infinite}
.bunting{position:absolute;left:0;right:0;top:0;width:100%;height:64px;z-index:-1}
.trumpeter{position:absolute;top:-170px;width:clamp(110px,11vw,170px);z-index:2}
.trumpeter.left{left:9%}.trumpeter.right{right:9%}
.podium-clouds{display:block;width:100%;height:70px;margin-top:-34px;position:relative;z-index:1}
.podium{position:relative;z-index:1}
.medal{position:absolute;top:-22px;left:-14px;width:44px;height:58px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.pcol.p1 .pcard{padding-top:22px}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (max-width:900px){.trumpeter{display:none}}
@media (max-width:560px){.pcard{padding:14px 6px}.pteam{padding:4px 5px;border-left-width:4px}.medal{left:-8px;width:34px;height:46px}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* Банк */
.lvtabs{display:flex;gap:8px;flex-wrap:wrap}
.lvtabs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800}
.lvtabs button[aria-pressed="true"]{border-color:var(--lv);background:var(--lv);color:#fff}
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qhead .n{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums;min-width:2.2em}
.qhead .t{font-weight:800;flex:1;min-width:0}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-left:3.2em}
.qopts span{background:var(--bg);border-radius:8px;padding:6px 10px;min-width:0;overflow-wrap:anywhere}
.qopts span.ok{background:var(--green-soft);font-weight:800}
.qopts span.ok::before{content:"✓ ";color:var(--green)}
.edit-grid{display:grid;gap:10px}
.opt-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.opt-row label{display:flex;gap:6px;align-items:center;font-weight:800;white-space:nowrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--red-soft);border-radius:10px;padding:10px 12px}

/* Настройки */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.switch{display:flex;gap:12px;align-items:flex-start}
.switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--blue);flex:none}
.trip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trip label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:20}

@media (max-width:720px){
  .answers,.qopts{grid-template-columns:1fr}
  .qopts{padding-left:0}
  .teams{grid-template-columns:1fr!important}
  .timer{margin-left:0}
  .pts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function merge(base,o){const r=JSON.parse(JSON.stringify(base));if(!o)return r;for(const k in o){if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))r[k]=Object.assign({},r[k],o[k]);else r[k]=o[k]}return r}

/* ---------- данные: хранятся в браузере этого компьютера ---------- */
const KEY_Q="velikaya-radost-questions-v1", KEY_S="velikaya-radost-settings-v1";
let storageOk=true;
function loadLocal(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){storageOk=false;return null}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageOk=false;return false}}
function defaultBank(){return DEFAULT_Q.map(q=>Object.assign({},q,{answers:q.answers.slice()}))}
function initDb(){
  const q=loadLocal(KEY_Q);
  questions=Array.isArray(q)&&q.length?q:defaultBank();
  const s=loadLocal(KEY_S); if(s) settings=merge(DEFAULTS,s);
  dbState="ready"; render();
}
function persistBank(){ if(!saveLocal(KEY_Q,questions)) toast("Изменения действуют до закрытия страницы") }
let settingsDirty=false;
async function saveQuestion(id,data){
  const i=questions.findIndex(q=>q.id===id);
  const rec=Object.assign({id},data);
  if(i>=0) questions[i]=rec; else questions.push(rec);
  persistBank(); return true;
}
async function deleteQuestion(id){
  questions=questions.filter(q=>q.id!==id); persistBank(); toast("Вопрос удалён"); render();
}
function exportBank(){
  const blob=new Blob([JSON.stringify(questions,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="velikaya-radost-voprosy.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function importBank(file){
  const rd=new FileReader();
  rd.onload=()=>{try{
    const arr=JSON.parse(rd.result);
    const ok=Array.isArray(arr)?arr.filter(q=>q&&["easy","medium","hard"].includes(q.level)&&q.question&&Array.isArray(q.answers)&&q.answers.length===3&&[0,1,2].includes(q.correct)):[];
    if(!ok.length){toast("В файле нет подходящих вопросов");return}
    questions=ok.map((q,i)=>({id:q.id||("q"+i),level:q.level,question:String(q.question),answers:q.answers.map(String),correct:q.correct,order:q.order??i+1}));
    persistBank(); toast("Загружено вопросов: "+questions.length); render();
  }catch(e){toast("Не удалось прочитать файл")}};
  rd.readAsText(file);
}

function render(){
  document.querySelectorAll("nav.tabs button[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"page":"false"));
  const app=$("#app");

  else if(view==="settings") app.innerHTML=renderSettings();
  else app.innerHTML=renderGame();
  bind();
}

function confetti(amount){
  try{ if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return }catch(e){}
  const cv=document.createElement("canvas"); cv.className="confetti"; document.body.appendChild(cv);
  const ctx=cv.getContext("2d"); const dpr=window.devicePixelRatio||1;

  const ps=Array.from({length:amount},()=>({x:W*(.2+Math.random()*.6),y:H*.55,vx:(Math.random()-.5)*16*dpr,vy:-(8+Math.random()*14)*dpr,
    s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],star:Math.random()<.3}));
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.star){ctx.beginPath();for(let i=0;i<8;i++){const rad=i%2?p.s*.45:p.s;const a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.fill()}

}

    <details class="panel" ${confirmReset?"open":""}><summary style="cursor:pointer;font-weight:800">Перенос вопросов на другой компьютер</summary>
      <div class="stack" style="margin-top:12px">
        <p class="hidden-msg" style="margin:0">Вопросы и правки хранятся в браузере этого компьютера. Чтобы перенести их, сохраните файл с вопросами и загрузите его на другом компьютере.</p>
        <div class="row">
          <button class="btn" id="exportQ">Сохранить файл с вопросами</button>
          <label class="btn" for="importQ" style="display:inline-block">Загрузить файл с вопросами</label>
          <input type="file" id="importQ" accept=".json,application/json" hidden>
          <button class="btn danger" id="resetQ">Вернуть исходные 129 вопросов</button>
        </div>
        ${confirmReset?`<div class="confirm"><span>Все ваши правки в банке будут удалены. Продолжить?</span><button class="btn danger" id="resetYes">Да, вернуть исходные</button><button class="btn" id="resetNo">Отмена</button></div>`:""}
      </div></details>
    <div class="qlist">${list.length?list.map(card).join(""):`<div class="panel hidden-msg">В этом разделе пока нет вопросов. Нажмите «Добавить вопрос», чтобы создать первый.</div>`}</div>
  </div>`;
}
function editForm(q){
  const id=q?q.id:"new";
  const d=q||{question:"",answers:["","",""],correct:0,level:bankLevel};
  return `<form class="qcard edit-grid" id="form-${id}" data-form="${id}">
    <div class="label">${q?"Изменение вопроса":"Новый вопрос"}</div>
    <label class="stack" style="gap:6px"><span class="label">Текст вопроса</span><textarea id="fq-${id}" name="q" required>${esc(d.question)}</textarea></label>
    <span class="label">Варианты ответа — отметьте верный</span>
    ${[0,1,2].map(k=>`<div class="opt-row"><label><input type="radio" name="correct" value="${k}" id="fc-${id}-${k}" ${d.correct===k?"checked":""}> ${LETTERS[k]} верный</label><input type="text" id="fa-${id}-${k}" name="a${k}" required value="${esc(d.answers[k])}" placeholder="Ответ ${LETTERS[k]}"></div>`).join("")}
    <label class="row"><span class="label">Уровень</span>
      <select id="fl-${id}" name="level" style="padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)">${LEVELS.map(([l,,n])=>`<option value="${l}" ${d.level===l?"selected":""}>${n}</option>`).join("")}</select></label>
    <div class="row"><button type="submit" class="btn primary">Сохранить</button><button type="button" class="btn" data-cancel="1">Отмена</button></div>
  </form>`;
}

/* ---------- НАСТРОЙКИ ---------- */
function renderSettings(){
  const s=settings; const ro=!canWrite;
  const trip=(key,unit)=>`<div class="trip">${LEVELS.map(([l,,n])=>`<label>${n}<input type="number" id="s-${key}-${l}" data-s="${key}.${l}" min="0" step="${key==="points"?"0.5":"1"}" value="${s[key][l]}"></label>`).join("")}</div>`;
  return `<div class="stack">
    <div><h1>Настройки ведущего</h1><p class="lead">Эти настройки меняют правила и ход игры. Правила для игроков составляются по ним автоматически.</p></div>
    ${stateBanner()}
    <div class="set-grid">
      <section class="panel stack"><h2>Баллы за вопрос</h2>${trip("points")}</section>
      <section class="panel stack"><h2>Время на вопрос, секунды</h2>${trip("time")}
        <label class="switch"><input type="checkbox" id="s-timerOn" data-sw="timerOn" ${s.timerOn?"checked":""}><span><b>Таймер включён</b><br><span class="hidden-msg">Если выключить, ведущий сам решает, когда показать ответ.</span></span></label></section>
      <section class="panel stack"><h2>Очерёдность и бонус</h2>
        <label class="switch"><input type="checkbox" id="s-orderOn" data-sw="orderOn" ${s.orderOn?"checked":""}><span><b>Учитывать, какая команда нажала кнопку первой</b><br><span class="hidden-msg">Ведущий отмечает порядок нажатия, команды отвечают по очереди.</span></span></label>
        <label class="switch"><input type="checkbox" id="s-bonusOn" data-sw="bonusOn" ${s.bonusOn?"checked":""} ${s.orderOn?"":"disabled"}><span><b>Бонус и штраф первой команде</b><br><span class="hidden-msg">Верно — плюс, неверно — минус. Работает, только если учитывается очерёдность.</span></span></label>
        <label class="trip" style="grid-template-columns:1fr"><span>Размер бонуса и штрафа, баллы</span><input type="number" id="s-bonus" data-s="bonus" min="0" step="0.5" value="${s.bonus}"></label>
      </section>
      <section class="panel stack"><h2>Вопросов в игре по умолчанию</h2>${trip("count")}</section>
      <section class="panel stack" style="grid-column:1/-1"><h2>Дополнительные правила</h2>
        <p class="hidden-msg" style="margin:0">Каждая строка станет отдельным пунктом в правилах для игроков.</p>
        <textarea id="s-extra" data-s="extra" rows="4" placeholder="Например: подсказывать другим командам нельзя.">${esc(s.extra)}</textarea></section>
      <section class="panel stack"><h2>Вход для ведущего</h2>
        <p class="hidden-msg" style="margin:0">Новые логин и пароль действуют на этом компьютере.</p>
        <label class="stack" style="gap:6px"><span class="label">Новый логин</span><input type="text" id="s-login" value="${esc(creds().login)}" autocomplete="off"></label>
        <label class="stack" style="gap:6px"><span class="label">Новый пароль</span><input type="text" id="s-pass" placeholder="Введите новый пароль" autocomplete="off"></label>
        <div class="row"><button class="btn" id="saveCreds">Сменить логин и пароль</button></div></section>
    </div>
    <div class="row">${ro?`<span class="note">Изменять настройки может владелец страницы.</span>`:`<button class="btn primary big" id="saveSettings" ${dbState==="ready"||dbState==="off"?"":"disabled"}>Сохранить настройки</button><button class="btn" id="resetSettings">Вернуть стандартные</button>`}</div>
  </div>`;
}
function readSettingsForm(){
  const s=JSON.parse(JSON.stringify(settings));
  document.querySelectorAll("[data-s]").forEach(el=>{
    const path=el.dataset.s.split("."); let v=el.type==="number"?Math.max(0,Number(el.value)||0):el.value;
    if(path.length===2)s[path[0]][path[1]]=v; else s[path[0]]=v;
  });
  document.querySelectorAll("[data-sw]").forEach(el=>s[el.dataset.sw]=el.checked);
  if(!s.orderOn)s.bonusOn=false;
  LEVELS.forEach(([l])=>{s.count[l]=Math.round(s.count[l]);if(s.time[l]<5)s.time[l]=5});
  return s;
}

/* ---------- обработчики ---------- */
function bind(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  on("#loginForm","submit",e=>{
    e.preventDefault(); const f=e.currentTarget, c=creds();
    if(f.login.value.trim()===c.login&&f.password.value===c.password){
      authed=true;loginError="";try{sessionStorage.setItem(KEY_SESSION,"1")}catch(err){}render();toast("Вы вошли как ведущий");
    } else {loginError="Неверный логин или пароль. Проверьте раскладку клавиатуры и попробуйте ещё раз.";render();const p=$("#lg-pass");p&&p.focus()}
  });
  on("#saveCreds","click",()=>{
    const l=($("#s-login")||{}).value?.trim(), p=($("#s-pass")||{}).value||"";
    if(!l||!p){toast("Введите новый логин и пароль");return}
    toast(saveLocal(KEY_A,{login:l,password:p})?"Логин и пароль изменены":"Не удалось сохранить на этом компьютере");
    render();
  });
  if(view==="game"){
    if(game.phase==="setup"){
      on("[data-tc]","click",e=>{readNames();game.teamCount=Number(e.currentTarget.dataset.tc);render()});
      on("[data-tn]","input",e=>game.names[e.target.dataset.tn]=e.target.value);
      on("[data-qc]","input",e=>{game.count=game.count||Object.assign({},settings.count);game.count[e.target.dataset.qc]=Math.max(0,Number(e.target.value)||0)});
      on("#toRules","click",()=>{
        readNames();
        const qty=game.count||settings.count; let list=[];
        LEVELS.forEach(([l])=>{list=list.concat(shuffle(byLevel(l)).slice(0,Math.min(qty[l]||0,byLevel(l).length)))});
        if(!list.length){toast("Выберите хотя бы один вопрос");return}
        game.teams=Array.from({length:game.teamCount},(_,i)=>({name:(game.names[i]||"").trim()||`Команда ${i+1}`,color:TCOLORS[i]}));
        game.list=list.map(q=>({level:q.level,question:q.question,answers:q.answers.slice(),correct:q.correct}));
        game.results=list.map(()=>({ans:Array(game.teamCount).fill(null),order:Array(game.teamCount).fill(0),revealed:false}));
        game.idx=0;game.reveal=null;game.phase="rules";render();window.scrollTo(0,0);
      });
    } else if(game.phase==="rules"){
      on("#backSetup","click",()=>{game.phase="setup";render()});
      on("#startGame","click",()=>{game.phase="play";finishConfirm=false;startTimer();render();window.scrollTo(0,0);try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}});
    } else if(game.phase==="play"){
      const r=curR();
      on("[data-ans]","click",e=>{const i=+e.currentTarget.dataset.team,k=+e.currentTarget.dataset.ans;r.ans[i]=r.ans[i]===k?null:k;render()});
      on("[data-press]","click",e=>{const i=+e.currentTarget.dataset.press;r.order[i]=Math.max(0,...r.order)+1;render()});
      on("[data-unorder]","click",e=>{const i=+e.currentTarget.dataset.unorder,v=r.order[i];r.order=r.order.map(x=>x>v?x-1:(x===v?0:x));render()});
      on("#resetOrder","click",()=>{r.order=r.order.map(()=>0);render()});
      on("#pauseT","click",()=>{if(timer.paused){timer.end=Date.now()+timer.left*1000;timer.paused=false}else{timer.paused=true}render()});
      on("#stopT","click",()=>{finishTimer()});
      on("#reveal","click",()=>{stopSilently();r.revealed=true;render()});
      on("#nextQ","click",()=>{if(!r.revealed){stopSilently();r.revealed=true;render();return}finishConfirm=false;
        const cur=curQ().level, nxt=game.list[game.idx+1];
        if(!nxt||nxt.level!==cur){clearInterval(tick);game.phase="round";game.roundLevel=cur;render();window.scrollTo(0,0);return}
        game.idx++;startTimer();render();window.scrollTo(0,0)});
      on("#finishEarly","click",()=>{finishConfirm=true;render()});
      on("#finishNo","click",()=>{finishConfirm=false;render()});
      on("#finishYes","click",()=>{clearInterval(tick);finishConfirm=false;game.phase="end";render()});
    } else if(game.phase==="round"){
      on("#afterRound","click",()=>{if(game.idx+1<game.list.length){game.idx++;game.phase="play";startTimer()}else game.phase="end";render();window.scrollTo(0,0)});
    } else if(game.phase==="end"){
      on("#newGame","click",()=>{game.phase="setup";game.count=null;game.reveal=null;render()});
      const n=endPlaces().filled.length;
      const after=()=>{if(game.reveal>=n){confetti(260);chime([523,659,784,1047])}else{confetti(60);chime([523,659])}};
      on("#revealNext","click",()=>{game.reveal=Math.min(n,game.reveal+1);render();after()});
      on("#revealAll","click",()=>{game.reveal=n;render();after()});
      on("#cheer","click",()=>{confetti(260);chime([523,659,784,1047])});
    }
  }
  if(view==="bank"){
    on("[data-bl]","click",e=>{bankLevel=e.currentTarget.dataset.bl;editing=null;adding=false;confirmDel=null;render()});
    on("#addQ","click",()=>{adding=true;editing=null;render();const t=$("#fq-new");t&&t.focus()});
    on("[data-edit]","click",e=>{editing=e.currentTarget.dataset.edit;adding=false;confirmDel=null;render()});
    on("[data-del]","click",e=>{confirmDel=e.currentTarget.dataset.del;render()});
    on("[data-delno]","click",()=>{confirmDel=null;render()});
    on("[data-delyes]","click",async e=>{const id=e.currentTarget.dataset.delyes;confirmDel=null;await deleteQuestion(id)});
    on("[data-cancel]","click",()=>{editing=null;adding=false;render()});
    on("#exportQ","click",exportBank);
    on("#importQ","change",e=>{const f=e.target.files&&e.target.files[0];if(f)importBank(f)});
    on("#resetQ","click",()=>{confirmReset=true;render()});
    on("#resetNo","click",()=>{confirmReset=false;render()});
    on("#resetYes","click",()=>{confirmReset=false;questions=defaultBank();persistBank();toast("Исходные вопросы возвращены");render()});
    on("[data-form]","submit",async e=>{
      e.preventDefault(); const f=e.currentTarget, id=f.dataset.form;
      const data={question:f.q.value.trim(),answers:[f.a0.value.trim(),f.a1.value.trim(),f.a2.value.trim()],correct:Number((f.querySelector("input[name=correct]:checked")||{}).value||0),level:f.level.value};
      if(!data.question||data.answers.some(a=>!a)){toast("Заполните вопрос и все три ответа");return}
      const old=questions.find(q=>q.id===id);
      data.order= old&&old.level===data.level ? old.order : Math.max(0,...questions.map(q=>q.order||0))+1;
      const docId=id==="new"?("q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)):id;
      if(await saveQuestion(docId,data)){editing=null;adding=false;bankLevel=data.level;toast(id==="new"?"Вопрос добавлен":"Изменения сохранены");render()}
    });
  }
  if(view==="settings"){
    on("[data-s],[data-sw]","input",()=>{settingsDirty=true});
    on("[data-sw=orderOn]","change",e=>{const b=$("#s-bonusOn");if(b){b.disabled=!e.target.checked;if(!e.target.checked)b.checked=false}});
    on("#saveSettings","click",async()=>{
      const s=readSettingsForm(); settings=s; settingsDirty=false;
      toast(saveLocal(KEY_S,s)?"Настройки сохранены":"Настройки действуют до закрытия страницы");
      render();
    });
    on("#resetSettings","click",()=>{settings=JSON.parse(JSON.stringify(DEFAULTS));settingsDirty=true;render();toast("Стандартные значения — нажмите «Сохранить»")});
  }
}
function readNames(){document.querySelectorAll("[data-tn]").forEach(el=>game.names[el.dataset.tn]=el.value)}

/* сохранение состояния игры при обновлении страницы */
function boot(data){
  if(data&&data.game){game=data.game;view=data.view||"game";
    if(game.phase==="play"&&data.timer){timer=data.timer;if(timer.running&&!timer.done){timer.end=Date.now()+timer.left*1000;tick=setInterval(step,200)}}}
  render(); initDb();
}
try{window.claude?.hot?.snapshot?.(()=>({game,view,timer}))}catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
